[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dag-role3"
version = "3.0.0"
description = "Role 3: dependency-DAG oversight environment and RL integration (v3, frozen)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "networkx>=3.0,<4",
    "matplotlib>=3.7,<4",
    "torch>=2.0,<3",
]

[tool.setuptools]
packages = ["dag_role3"]
